<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121214">
<title>Elite Crete</title>
<style>
:root{--bg:#121214;--card:#1b1b1e;--line:#2e2e33;--out:#17171a;--row:#26262b;--inp:#232328;--ibd:#34343a;--acc:#e07b1a;--big:#ffa23f;--mut:#a3a3a8;--ink:#f2f2f2;--ok:#5fce8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,sans-serif;padding:14px 14px 34px}
.top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
#brandImg{height:54px;width:54px;object-fit:contain;border-radius:9px}
.txt{flex:1;min-width:0}
.nm{font-size:19px;font-weight:600;letter-spacing:.3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{font-size:11px;color:var(--mut);margin-top:3px}
.gear{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:15px}
.gear.on{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--row);padding-bottom:9px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:#d8d8dc;white-space:nowrap}
.tab.on{background:var(--acc);border-color:var(--acc);color:#121214;font-weight:600}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.dim{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding:9px 0}
.dim:last-child{border-bottom:0}
.dim label{font-size:13px;color:var(--mut)}
.d3{display:flex;align-items:center;gap:4px;font-size:11px;color:#86868d}
.num{width:50px;text-align:right;font:16px ui-monospace,Menlo,monospace;padding:7px 6px;border-radius:7px;background:var(--inp);border:1px solid var(--ibd);color:var(--ink);-webkit-appearance:none;appearance:none}
select.num{width:66px;text-align:left;font-size:13px}
.out{background:var(--out);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.orow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-bottom:1px solid var(--row)}
.orow:last-child{border-bottom:0}
.orow span{font-size:12.5px;color:var(--mut)}
.oval{font:17px ui-monospace,Menlo,monospace}
.oval.big{font-size:27px;color:var(--big)}
.oval.good{color:var(--ok)}
.oval.dim{font-size:13px;color:var(--mut)}
.hint{font-size:11px;color:#8b8b92;margin-top:10px}
.mini{font-size:12px;padding:9px 12px;border-radius:8px;border:1px solid var(--ibd);background:var(--card);color:var(--ink)}
.mini.pri{background:var(--acc);border-color:var(--acc);color:#121214;font-weight:600}
.row2{display:flex;gap:8px;margin-top:12px}
#logoPrev{width:66px;height:66px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--inp)}
.wide{width:100%;padding:10px;border-radius:8px;background:var(--inp);border:1px solid var(--ibd);color:var(--ink);font-size:15px;font-family:inherit}
#tt{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ok);color:#06230f;font-size:13px;font-weight:700;padding:9px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
#tt.on{opacity:1}
</style>
</head>
<body>
<div class="top">
<img id="brandImg" src="IMG_5391.jpeg" alt="Elite Crete">
<div class="txt"><div class="nm" id="nm">Elite Crete</div><div class="tg" id="tg">From form to finish</div></div>
<button class="gear" id="gear">&#9881;</button>
</div>
<div class="tabs" id="tabs"></div>
<div id="panes"></div>
<div id="tt">Saved</div>
<script>
"use strict";
const $=i=>document.getElementById(i);
const f=i=>{const e=$(i);return e?parseFloat(e.value)||0:0};
const fx=x=>(isFinite(x)?x:0);
const F=(x,d)=>fx(x).toFixed(d);
const D=(id,label)=>({k:"d",id:id,label:label});
const N=(id,label,val,unit)=>({k:"n",id:id,label:label,val:val,unit:unit||""});
const S=(id,label,opts)=>({k:"s",id:id,label:label,opts:opts});
let FR='<option value="0">0</option>';
for(let n=1;n<16;n++)FR+='<option value="'+(n/16)+'">'+n+'/16</option>';
const WASTE=[["1","none"],["1.05","5%"],["1.1","10%"]].map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join("");
const BARS=[[0.376,"#3"],[0.668,"#4"],[1.043,"#5"],[1.502,"#6"],[2.044,"#7"],[2.67,"#8"],[3.4,"#9"],[4.303,"#10"],[5.313,"#11"]];
const P=[
{id:"cross",t:"Cross square",hint:"Both diagonals must match before you stake.",f:[D("cL","Length"),D("cW","Width")],r:[["xDiag","Cross square","big"],["xSqft","Square feet"],["xSqin","Square inches"],["xPer","Perimeter"]]},
{id:"rebar",t:"Rebar",f:[D("rL","Grid length"),D("rW","Grid width"),N("rSp","Spacing o/c","18","in"),S("rBar","Bar size",BARS.map(b=>'<option value="'+b[0]+'">'+b[1]+'</option>').join("")),D("rRe","Reuse over")],r:[["bBuy","20 ft bars to buy","big"],["bLen","Bars lengthwise"],["bCro","Bars crosswise"],["bSlab","Length in the slab"],["bOff","Offcut per run"],["bReuse","Reusable offcut","good"],["bCov","Bars offcut covers"],["bWaste","Waste"],["bWt","Weight to haul"]]},
{id:"pipe",t:"Floor pipe",f:[D("pL","Floor length"),D("pW","Floor width"),S("pPipe","Pipe",'<option value="12">1/2 in at 12 in o/c - 300 ft runs</option><option value="16">5/8 in at 16 in o/c - 400 ft runs</option>')],r:[["pOrder","Pipe to order","big"],["pLoops","Loops"],["pPorts","Manifold ports"],["pMan","Manifolds to buy"],["pCoilLen","Coil length"],["pCoils","Coils to buy"],["pAvg","Average loop"],["pMax","Max run for this pipe"]]},
{id:"mm",t:"mm to inch",f:[N("mMm","Millimeters","0","mm")],r:[["mFt","Feet and inches","big"],["m16","Inches nearest 1/16"],["mDec","Decimal inches"]]},
{id:"gravel",t:"Gravel",f:[D("gL","Length"),D("gW","Width"),D("gD","Depth"),S("gWaste","Waste",WASTE)],r:[["gCy","Gravel needed","big"],["gCf","Cubic feet"],["gTon","Approx tons"],["gBags","Half cubic foot bags"]]},
{id:"conc",t:"Concrete",f:[D("kL","Length"),D("kW","Width"),D("kT","Thickness"),S("kWaste","Waste",WASTE)],r:[["kCy","Concrete needed","big"],["kCf","Cubic feet"],["k80","80 lb bags"],["k60","60 lb bags"]]}
];
function field(x){
if(x.k==="d")return '<div class="dim"><label>'+x.label+'</label><div class="d3"><input class="num" id="'+x.id+'f" inputmode="decimal" value="0">ft<input class="num" id="'+x.id+'i" inputmode="decimal" value="0">in<select class="num" id="'+x.id+'q">'+FR+'</select></div></div>';
if(x.k==="n")return '<div class="dim"><label>'+x.label+'</label><div class="d3"><input class="num" id="'+x.id+'" inputmode="decimal" value="'+x.val+'">'+x.unit+'</div></div>';
return '<div class="dim"><label>'+x.label+'</label><div class="d3"><select class="num" id="'+x.id+'">'+x.opts+'</select></div></div>';
}
const dv=id=>f(id+"f")+f(id+"i")/12+f(id+"q")/12;
const setupPane='<section class="pane" id="setup"><div class="card"><div class="dim"><label>Company logo</label><img id="logoPrev" src="IMG_5391.jpeg" alt=""></div><div class="row2"><button class="mini" id="sUp">Upload logo</button><button class="mini" id="sRem">Remove</button></div><input type="file" id="sFile" accept="image/*" style="display:none"><div class="dim"><label>Company name</label><input class="wide" id="sName" style="width:52%"></div><div class="dim"><label>Tagline</label><input class="wide" id="sTag" style="width:52%"></div><div class="dim"><label>Phone</label><input class="wide" id="sPhone" type="tel" style="width:52%"></div><div class="dim"><label>License or email</label><input class="wide" id="sLic" style="width:52%"></div><div class="row2"><button class="mini pri" id="sSave">Save settings</button></div></div></section>';
$("tabs").innerHTML=P.map((p,i)=>'<button class="tab'+(i?"":" on")+'" data-p="'+p.id+'">'+p.t+'</button>').join("");
$("panes").innerHTML=P.map((p,i)=>'<section class="pane'+(i?"":" on")+'" id="'+p.id+'"><div class="card">'+p.f.map(field).join("")+'</div>'+(p.hint?'<div class="hint">'+p.hint+'</div>':"")+'<div class="out">'+p.r.map(r=>'<div class="orow"><span>'+r[1]+'</span><b class="oval '+(r[2]||"")+'" id="'+r[0]+'">&#8212;</b></div>').join("")+'</div></section>').join("")+setupPane;
function ftin(x){if(!(x>0))return"\u2014";let a=Math.floor(x),b=Math.round((x-a)*12);if(b===12){a++;b=0}return b?a+"' "+b+'"':a+"'"}
function calc(){
const L=dv("cL"),W=dv("cW"),d=Math.hypot(L,W);
$("xDiag").textContent=ftin(d);$("xSqft").textContent=F(L*W,2);$("xSqin").textContent=F(L*W*144,0);$("xPer").textContent=ftin(2*(L+W));
const rl=dv("rL"),rw=dv("rW"),sp=f("rSp")||18,bar=f("rBar")||0.668,re=dv("rRe"),US=220/12;
const lenw=Math.ceil(rw*12/sp)+1,cro=Math.ceil(rl*12/sp)+1,runs=[];
for(let i=0;i<lenw;i++)runs.push(rl);for(let i=0;i<cro;i++)runs.push(rw);
let bars=0,slab=0,off=0,reu=0;
runs.forEach(x=>{if(x<=0)return;const k=Math.ceil(x/US);bars+=k;slab+=x;const o=k*US-x;off+=o;if(o>=re)reu+=o});
const cov=Math.floor(reu/US),buy=Math.max(0,bars-cov);
$("bBuy").textContent=F(buy,0);$("bLen").textContent=F(lenw,0);$("bCro").textContent=F(cro,0);
$("bSlab").textContent=F(slab,0)+" ft";$("bOff").textContent=F(runs.length?off/runs.length:0,1)+" ft";
$("bReuse").textContent=F(reu,1)+" ft";$("bCov").textContent=F(cov,0);
$("bWaste").textContent=F(Math.max(0,buy*20-slab),1)+" ft";$("bWt").textContent=F(buy*20*bar,0)+" lb";
const pl=dv("pL"),pw=dv("pW"),ps=f("pPipe")||12;
const area=pl*pw,run=ps===16?400:300,spc=ps;
const pipe=area*(12/spc)*1.1;
const loops=Math.max(1,Math.ceil(pipe/run)),ports=loops,man=Math.ceil(ports/12),coils=Math.ceil(pipe/run);
$("pOrder").textContent=F(pipe,0)+" ft";$("pLoops").textContent=F(loops,0);$("pPorts").textContent=F(ports,0);
$("pMan").textContent=F(man,0);$("pCoilLen").textContent=run+" ft";$("pCoils").textContent=F(coils,0);
$("pAvg").textContent=F(pipe/loops,0)+" ft";$("pMax").textContent=run+" ft";
const mm=f("mMm"),inch=mm/25.4;
$("mFt").textContent=ftin(inch/12);$("m16").textContent=F(Math.round(inch*16)/16,4)+" in";$("mDec").textContent=F(inch,4)+" in";
const gL=dv("gL"),gW=dv("gW"),gD=dv("gD"),gw=f("gWaste")||1;
const gcf=gL*gW*gD*gw;
$("gCy").textContent=F(gcf/27,2)+" yd";$("gCf").textContent=F(gcf,1)+" ft";$("gTon").textContent=F(gcf/27*1.4,2)+" t";$("gBags").textContent=F(Math.ceil(gcf/0.5),0);
const kL=dv("kL"),kW=dv("kW"),kT=dv("kT"),kw=f("kWaste")||1;
const kcf=kL*kW*kT*kw;
$("kCy").textContent=F(kcf/27,2)+" yd";$("kCf").textContent=F(kcf,1)+" ft";$("k80").textContent=F(Math.ceil(kcf/0.6),0);$("k60").textContent=F(Math.ceil(kcf/0.45),0);
}
let cur="cross",set=false;
function show(id){cur=id;set=false;$("tabs").style.display="flex";$("gear").classList.remove("on");
document.querySelectorAll(".pane").forEach(x=>x.classList.toggle("on",x.id===id));
document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.p===id));}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.p));
$("gear").onclick=()=>{set=!set;
document.querySelectorAll(".pane").forEach(x=>x.classList.toggle("on",x.id===(set?"setup":cur)));
$("tabs").style.display=set?"none":"flex";$("gear").classList.toggle("on",set);if(set)loadSetup();};
const KC="jc_co",KL="jc_logo";
const readCo=()=>{try{return JSON.parse(localStorage.getItem(KC))||{}}catch(e){return{}}};
function applyCo(){const c=readCo();
$("nm").textContent=c.name||"Elite Crete";$("tg").textContent=c.tag||"From form to finish";
document.title=(c.name||"Elite Crete");}
function applyLogo(){const s=localStorage.getItem(KL);
if(s){$("brandImg").src=s;$("logoPrev").src=s}else{$("brandImg").src="IMG_5391.jpeg";$("logoPrev").src="IMG_5391.jpeg"}}
function loadSetup(){const c=readCo();
$("sName").value=c.name||"Elite Crete";$("sTag").value=c.tag||"From form to finish";
$("sPhone").value=c.phone||"306-461-6381";$("sLic").value=c.lic||"Elitecrete33@gmail.com";applyLogo();}
function toast(m){const t=$("tt");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1500)}
$("sSave").onclick=()=>{const c={name:$("sName").value.trim()||"Elite Crete",tag:$("sTag").value.trim(),phone:$("sPhone").value.trim(),lic:$("sLic").value.trim()};
try{localStorage.setItem(KC,JSON.stringify(c))}catch(e){}applyCo();toast("Saved")};
$("sUp").onclick=()=>$("sFile").click();
$("sFile").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();
r.onload=()=>{try{localStorage.setItem(KL,r.result);applyLogo();toast("Logo saved")}catch(x){toast("Logo too big")}};r.readAsDataURL(fl)};
$("sRem").onclick=()=>{try{localStorage.removeItem(KL)}catch(e){}applyLogo();toast("Logo removed")};
document.querySelectorAll("input,select").forEach(e=>{e.oninput=calc;e.onchange=calc});
applyCo();applyLogo();calc();
</script>
</body>
</html>
