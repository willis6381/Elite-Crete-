<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>Elite Crete Takeoff</title>
<style>
:root{--b:#0f1113;--p:#171a1e;--p2:#1d2227;--l:#2b3138;--t:#eceeef;--m:#8b949e;--a:#f5a524;--o:#3fb950}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--b);color:var(--t);font:16px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:9;background:#0f1113f2;border-bottom:1px solid var(--l);padding:calc(8px + env(safe-area-inset-top)) 14px 10px}
.bar{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto}
#lg{width:44px;height:44px;flex:0 0 44px;border-radius:10px;border:1px solid var(--l);background:var(--p2);display:grid;place-items:center;overflow:hidden;font-size:15px;color:var(--m)}
#lg img{width:100%;height:100%;object-fit:cover}
.b{flex:1;min-width:0}
#n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#g{font-size:11.5px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gear{width:38px;height:38px;flex:0 0 38px;border-radius:10px;border:1px solid var(--l);background:var(--p2);color:var(--t);font-size:16px}
nav{display:flex;gap:7px;overflow-x:auto;padding-top:10px;max-width:520px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;padding:8px 13px;border-radius:99px;border:1px solid var(--l);background:var(--p);color:var(--m);font:600 13px inherit;white-space:nowrap}
nav .on{background:var(--a);border-color:var(--a);color:#1a1200}
main{max-width:520px;margin:0 auto;padding:14px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 12px;font:700 12px inherit;letter-spacing:1px;text-transform:uppercase;color:var(--m)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid.one{grid-template-columns:1fr}
label{display:block;font-size:11px;font-weight:600;color:var(--m);margin-bottom:4px}
input,select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--l);background:var(--p2);color:var(--t);font:600 16px inherit;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none;border-color:var(--a)}
.out{background:var(--p);border:1px solid var(--l);border-radius:14px;overflow:hidden;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--l)}
.row:last-child{border:0}
.row span{font-size:13px;color:var(--m)}
.row b{font-variant-numeric:tabular-nums}
.big b{font-size:20px;color:var(--a)}
.ok b{color:var(--o)}
.btn{flex:1;padding:13px;border-radius:11px;border:1px solid var(--l);background:var(--p2);color:var(--t);font:700 14px inherit}
.btn.primary{background:var(--a);border-color:var(--a);color:#1a1200}
footer{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#0f1113fa;border-top:1px solid var(--l);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
footer .btn{display:block;width:100%;max-width:520px;margin:0 auto;padding:14px;font-size:15px}
#sw{position:fixed;inset:0;z-index:60;display:none}
#sw.on{display:block}
#sc{position:absolute;inset:0;background:#000a}
#sh{position:absolute;left:0;right:0;bottom:0;background:var(--p);border-radius:18px 18px 0 0;padding:16px 14px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
#sh h3{margin:0 0 4px;font-size:17px}
#sh p{margin:0 0 12px;font-size:12px;color:var(--m)}
.act{display:flex;gap:9px;margin-top:12px}
#tt{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--o);color:#05230d;font:800 13px inherit;padding:9px 18px;border-radius:99px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
#tt.on{opacity:1}
</style>
</head>
<body>
<header>
<div class="bar">
<div id="lg">EC</div>
<div class="b"><div id="n">Elite Crete</div><div id="g">From form to finish</div></div>
<button id="gear">&#9881;</button>
</div>
<nav id="nav"></nav>
</header>
<main id="main"></main>
<footer><button class="btn primary" id="shareBtn">Share takeoff</button></footer>
<div id="sw"><div id="sc"></div><div id="sh">
<h3>Company settings</h3><p>Saved on this phone only.</p>
<div class="grid one">
<div><label>Company</label><input id="sName"></div>
<div><label>Tagline</label><input id="sTag"></div>
<div><label>Phone</label><input id="sPhone"></div>
<div><label>Email</label><input id="sEmail"></div>
<div><label>Logo</label><input type="file" id="sLogo" accept="image/*"></div>
</div>
<div class="act"><button class="btn" id="sClose">Close</button><button class="btn primary" id="sSave">Save</button></div>
</div></div>
<div id="tt">Copied</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const P=[
{id:"cross",t:"Cross Square",f:[["cL","Length (ft)","n",20],["cW","Width (ft)","n",20],["cN","Squares","n",1]],r:[["cDiag","Diagonal","big"],["cDiagIn","Diagonal in inches",""],["cTot","Total diagonal run","ok"]]},
{id:"rebar",t:"Rebar",f:[["rL","Length (ft)","n",20],["rW","Width (ft)","n",20],["rSp","Spacing (in o/c)","n",18],["rBar","Bar size","s",0.5,[["0.5","#4 (1/2 in)"],["0.625","#5 (5/8 in)"],["0.75","#6 (3/4 in)"]]],["rReuse","Reuse threshold (ft)","n",10]],r:[["rRuns","Runs each way",""],["rLF","Total linear feet",""],["rBars","20 ft bars needed","big"],["rReuseOut","With reuse of scraps","ok"],["rC600","600 ft coils",""],["rC400","400 ft coils",""]]},
{id:"pipe",t:"Floor Pipe",f:[["pL","Length (ft)","n",20],["pW","Width (ft)","n",20],["pOC","Spacing","s",12,[["12","12 in o/c - 1/2 in pipe"],["16","16 in o/c - 5/8 in pipe"]]],["pCoil","Coil size","s",600,[["600","600 ft"],["400","400 ft"]]]],r:[["pSize","Pipe size",""],["pRuns","Runs",""],["pLF","Total linear feet","big"],["pCoils","Coils needed","ok"]]},
{id:"gravel",t:"Gravel",f:[["gL","Length (ft)","n",20],["gW","Width (ft)","n",20],["gD","Depth (in)","n",4]],r:[["gCY","Cubic yards","big"],["gTon","Tons (approx)",""],["gCYw","With 10% compaction","ok"]]},
{id:"conc",t:"Concrete",f:[["kL","Length (ft)","n",20],["kW","Width (ft)","n",20],["kT","Thickness (in)","n",4],["kWaste","Waste %","n",5]],r:[["kCY","Cubic yards","big"],["kCYw","With waste","ok"],["kCF","Cubic feet",""],["kB80","80 lb bags",""]]}
];
const fld=x=>x[2]==="s"
?`<div><label>${x[1]}</label><select id="${x[0]}">${x[4].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select></div>`
:`<div><label>${x[1]}</label><input type="number" inputmode="decimal" id="${x[0]}" value="${x[3]}"></div>`;
$("nav").innerHTML=P.map((p,i)=>`<button data-p="${p.id}" class="${i?"":"on"}">${p.t}</button>`).join("");
$("main").innerHTML=P.map((p,i)=>`<section class="pane${i?"":" on"}" id="${p.id}"><div class="card"><h2>${p.t}</h2><div class="grid">${p.f.map(fld).join("")}</div></div><div class="out">${p.r.map(r=>`<div class="row ${r[2]||""}"><span>${r[1]}</span><b id="${r[0]}">&#8212;</b></div>`).join("")}</div></section>`).join("");
const v=id=>parseFloat($(id).value)||0;
const F=(x,d)=>((isFinite(x)?x:0)).toFixed(d);
const US=(20*12-20)/12;
const ftin=x=>{if(!(x>0))return"\u2014";let f=Math.floor(x),i=Math.round((x-f)*12);if(i===12){f++;i=0}return i?f+"\u2032 "+i+"\u2033":f+"\u2032"};
function up(){
const L=v("cL"),W=v("cW"),N=Math.max(1,v("cN")),d=Math.hypot(L,W);
$("cDiag").textContent=ftin(d);$("cDiagIn").textContent=F(d*12,1)+" in";$("cTot").textContent=ftin(d*N)+" ("+F(d*N,1)+" ft)";
const a=v("rL"),b=v("rW"),s=v("rSp")||18,ru=v("rReuse");
const ac=Math.ceil(b*12/s)+1,dn=Math.ceil(a*12/s)+1,pc=[];
for(let i=0;i<ac;i++)pc.push(a);for(let i=0;i<dn;i++)pc.push(b);
const lf=pc.reduce((x,y)=>x+y,0);
let nb=0,sr=0;pc.forEach(l=>{if(l<=0)return;const k=Math.ceil(l/US);nb+=k;sr+=k*US-l});
const sv=sr>=ru?Math.floor(sr/US):0;
$("rRuns").textContent=ac+" \u00d7 "+dn;$("rLF").textContent=F(lf,0)+" ft";$("rBars").textContent=F(nb,0);
$("rReuseOut").textContent=F(Math.max(0,nb-sv),0)+" (saves "+F(sv,0)+")";
$("rC600").textContent=F(Math.ceil(lf/600),0);$("rC400").textContent=F(Math.ceil(lf/400),0);
const pl=v("pL"),pw=v("pW"),po=v("pOC")||12,pco=v("pCoil")||600;
const pa=Math.ceil(pw*12/po)+1,pd=Math.ceil(pl*12/po)+1,pt=pa*pl+pd*pw;
$("pSize").textContent=po===16?"5/8 @ 16":"1/2 @ 12";
$("pRuns").textContent=pa+" \u00d7 "+pd;$("pLF").textContent=F(pt,0)+" ft";$("pCoils").textContent=F(Math.ceil(pt/pco),0)+" \u00d7 "+pco+" ft";
const gc=v("gL")*v("gW")*(v("gD")/12)/27;
$("gCY").textContent=F(gc,2);$("gTon").textContent=F(gc*1.4,1);$("gCYw").textContent=F(gc*1.1,2);
const cf=v("kL")*v("kW")*(v("kT")/12),cy=cf/27;
$("kCF").textContent=F(cf,1);$("kCY").textContent=F(cy,2);$("kCYw").textContent=F(cy*(1+v("kWaste")/100),2);$("kB80").textContent=F(Math.ceil(cf/0.6),0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));b.classList.add("on");$(b.dataset.p).classList.add("on")});
document.querySelectorAll("input,select").forEach(e=>{e.oninput=up;e.onchange=up});
const KC="jc_co",KL="jc_logo";
const readCo=()=>{try{return JSON.parse(localStorage.getItem(KC))||{}}catch(e){return{}}};
function applyCo(){const c=readCo();$("n").textContent=c.name||"Elite Crete";$("g").textContent=c.tag||"From form to finish"}
function applyLogo(){const s=localStorage.getItem(KL);$("lg").innerHTML=s?'<img src="'+s+'" alt="">':"EC"}
function openSheet(){const c=readCo();$("sName").value=c.name||"Elite Crete";$("sTag").value=c.tag||"From form to finish";$("sPhone").value=c.phone||"306-461-6381";$("sEmail").value=c.email||"Elitecrete33@gmail.com";$("sw").classList.add("on")}
function closeSheet(){$("sw").classList.remove("on")}
function toast(m){const t=$("tt");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1500)}
function saveSheet(){const c={name:$("sName").value.trim()||"Elite Crete",tag:$("sTag").value.trim(),phone:$("sPhone").value.trim(),email:$("sEmail").value.trim()};try{localStorage.setItem(KC,JSON.stringify(c))}catch(e){}applyCo();closeSheet();toast("Saved")}
$("gear").onclick=openSheet;$("sClose").onclick=closeSheet;$("sc").onclick=closeSheet;$("sSave").onclick=saveSheet;
$("sLogo").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{localStorage.setItem(KL,r.result);applyLogo();toast("Logo saved")}catch(x){toast("Logo too big")}};r.readAsDataURL(f)};
function buildText(){
const p=document.querySelector(".pane.on"),c=readCo();
const o=[(c.name||"Elite Crete")+(c.tag?" \u2014 "+c.tag:""),p.querySelector("h2").textContent,""];
p.querySelectorAll(".grid>div").forEach(d=>{const l=d.querySelector("label"),i=d.querySelector("input,select");if(!l||!i)return;const x=i.tagName==="SELECT"?i.options[i.selectedIndex].text:i.value;if(x)o.push(l.textContent+": "+x)});
o.push("");
p.querySelectorAll(".row").forEach(r=>o.push(r.querySelector("span").textContent+": "+r.querySelector("b").textContent));
const f=[c.phone,c.email].filter(Boolean).join(" \u00b7 ");
if(f){o.push("");o.push(f)}
return o.join("\n");
}
async function shareNow(){
const t=buildText();
if(navigator.share){try{await navigator.share({title:"Takeoff",text:t});return}catch(e){if(e.name==="AbortError")return}}
try{await navigator.clipboard.writeText(t);toast("Copied")}
catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copied")}catch(x){toast("Copy failed")}a.remove()}
}
$("shareBtn").onclick=shareNow;
applyCo();applyLogo();up();
</script>
</body>
</html>
