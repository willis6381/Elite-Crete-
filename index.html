<!
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>Elite Crete — Takeoff</title>
<style>
:root{
  --bg:#0f1113;--panel:#171a1e;--panel2:#1d2227;--line:#2b3138;
  --ink:#eceeef;--mut:#8b949e;--acc:#f5a524;--ok:#3fb950;--bad:#e5534b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

header{
  position:sticky;top:0;z-index:30;
  background:rgba(15,17,19,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.bar{display:flex;align-items:center;gap:10px;max-width:520px;margin:0 auto}
#logoBox{
  width:44px;height:44px;flex:0 0 44px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);
  display:grid;place-items:center;overflow:hidden;font-size:17px;color:var(--mut)
}
#logoBox img{width:100%;height:100%;object-fit:cover}
.brand{flex:1;min-width:0}
#coName{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#coTag{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconBtn{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-size:16px;display:grid;place-items:center;cursor:pointer
}
.iconBtn:active{background:var(--line)}

nav{display:flex;gap:7px;overflow-x:auto;padding:11px 0 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;padding:8px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--mut);
  font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap
}
nav button.on{background:var(--acc);border-color:var(--acc);color:#1a1200}

main{padding-top:16px}
.pane{display:none}
.pane.on{display:block}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:13px;font-weight
</head>
<body>

<header>
  <div class="bar">
    <div id="logoBox">EC</div>
    <div class="brand">
      <div id="coName">Elite Crete</div>
      <div id="coTag">From form to finish</div>
    </div>
    <button class="iconBtn" id="gearBtn" aria-label="Settings">&#9881;</button>
  </div>
  <nav>
    <button class="on" data-pane="cross">Cross Square</button>
    <button data-pane="rebar">Rebar</button>
    <button data-pane="pipe">Floor Pipe</button>
    <button data-pane="gravel">Gravel</button>
    <button data-pane="conc">Concrete</button>
  </nav>
</header>

<main class="wrap">

  <section class="pane on" id="cross">
    <div class="card">
      <h2>Cross Square</h2>
      <div class="grid">
        <div><label>Length (ft)</label><input type="number" id="cL" inputmode="decimal" value="20"></div>
        <div><label>Width (ft)</label><input type="number" id="cW" inputmode="decimal" value="20"></div>
        <div><label>Number of squares</label><input type="number" id="cN" inputmode="numeric" value="1"></div>
      </div>
    </div>
    <div class="out">
      <div class="row big"><span>Diagonal</span><b id="cDiag">—</b></div>
      <div class="row"><span>Diagonal in inches</span><b id="cDiagIn">—</b></div>
      <div class="row ok"><span>Total diagonal run</span><b id="cTot">—</b></div>
    </div>
  </section>

  <section class="pane" id="rebar">
    <div class="card">
      <h2>Rebar</h2>
      <div class="grid">
        <div><label>Length (ft)</label><input type="number" id="rL" inputmode="decimal" value="20"></div>
        <div><label>Width (ft)</label><input type="number" id="rW" inputmode="decimal" value="20"></div>
        <div><label>Spacing (in o/c)</label><input type="number" id="rSp" inputmode="decimal" value="18"></div>
        <div><label>Bar size</label>
          <select id="rBar">
            <option value="0.5">#4 (1/2")</option>
            <option value="0.625">#5 (5/8")</option>
            <option value="0.75">#6 (3/4")</option>
          </select>
        </div>
        <div><label>Reuse threshold (ft)</label><input type="number" id="rReuse" inputmode="decimal" value="10"></div>
      </div>
    </div>
    <div class="out">
      <div class="row"><span>Runs each way</span><b id="rRuns">—</b></div>
      <div class="row"><span>Total linear feet</span><b id="rLF">—</b></div>
      <div class="row big"><span>20 ft bars needed</span><b id="rBars">—</b></div>
      <div class="row ok"><span>With reuse of scraps</span><b id="rReuseOut">—</b></div>
      <div class="row"><span>600 ft coils</span><b id="rC600">—</b></div>
      <div class="row"><span>400 ft coils</span><b id="rC400">—</b></div>
    </div>
  </section>

  <section class="pane" id="pipe">
    <div class="card">
      <h2>Floor Pipe</h2>
      <div class="grid">
        <div><label>Length (ft)</label><input type="number" id="pL" inputmode="decimal" value="20"></div>
        <div><label>Width (ft)</label><input type="number" id="pW" inputmode="decimal" value="20"></div>
        <div><label>Spacing</label>
          <select id="pOC">
            <option value="12">12 in o/c — 1/2" pipe</option>
            <option value="16">16 in o/c — 5/8" pipe</option>
          </select>
        </div>
        <div><label>Coil size</label>
          <select id="pCoil">
            <option value="600">600 ft</option>
            <option value="400">400 ft</option>
          </select>
        </div>
      </div>
    </div>
    <div class="out">
      <div class="row"><span>Pipe size</span><b id="pSize">—</b></div>
      <div class="row"><span>Runs</span><b id="pRuns">—</b></div>
      <div class="row big"><span>Total linear feet</span><b id="pLF">—</b></div>
      <div class="row ok"><span>Coils needed</span><b id="pCoils">—</b></div>
    </div>
  </section>

  <section class="pane" id="gravel">
    <div class="card">
      <h2>Gravel</h2>
      <div class="grid">
        <div><label>Length (ft)</label><input type="number" id="gL" inputmode="decimal" value="20"></div>
        <div><label>Width (ft)</label><input type="number" id="gW" inputmode="decimal" value="20"></div>
        <div><label>Depth (in)</label><input type="number" id="gD" inputmode="decimal" value="4"></div>
      </div>
    </div>
    <div class="out">
      <div class="row big"><span>Cubic yards</span><b id="gCY">—</b></div>
      <div class="row"><span>Tons (approx)</span><b id="gTon">—</b></div>
      <div class="row ok"><span>With 10% compaction</span><b id="gCYw">—</b></div>
    </div>
  </section>

  <section class="pane" id="conc">
    <div class="card">
      <h2>Concrete</h2>
      <div class="grid">
        <div><label>Length (ft)</label><input type="number" id="kL" inputmode="decimal" value="20"></div>
        <div><label>Width (ft)</label><input type="number" id="kW" inputmode="decimal" value="20"></div>
        <div><label>Thickness (in)</label><input type="number" id="kT" inputmode="decimal" value="4"></div>
        <div><label>Waste %</label><input type="number" id="kWaste" inputmode="decimal" value="5"></div>
      </div>
    </div>
    <div class="out">
      <div class="row big"><span>Cubic yards</span><b id="kCY">—</b></div>
      <div class="row ok"><span>With waste</span><b id="kCYw">—</b></div>
      <div class="row"><span>C
      <script>
"use strict";
const $ = id => document.getElementById(id);
const num = id => parseFloat($(id).value) || 0;
const f0 = x => (isFinite(x) ? x : 0).toFixed(0);
const f1 = x => (isFinite(x) ? x : 0).toFixed(1);
const f2 = x => (isFinite(x) ? x : 0).toFixed(2);

const BAR_FT = 20;
const LAP_IN = 20;
const USABLE = (BAR_FT * 12 - LAP_IN) / 12;   // 18.33 ft of usable bar

function ftin(x) {
  if (!isFinite(x) || x <= 0) return "—";
  let ft = Math.floor(x);
  let inch = Math.round((x - ft) * 12);
  if (inch === 12) { ft += 1; inch = 0; }
  return inch ? ft + "\u2032 " + inch + "\u2033" : ft + "\u2032";
}

function calcCross() {
  const L = num("cL"), W = num("cW"), N = Math.max(1, num("cN") || 1);
  const diag = Math.hypot(L, W);
  $("cDiag").textContent = ftin(diag);
  $("cDiagIn").textContent = f1(diag * 12) + " in";
  $("cTot").textContent = ftin(diag * N) + "  (" + f1(diag * N) + " ft)";
}

function calcRebar() {
  const L = num("rL"), W = num("rW");
  const sp = num("rSp") || 18;
  const reuse = num("rReuse");

  const across = Math.ceil((W * 12) / sp) + 1;
  const down = Math.ceil((L * 12) / sp) + 1;

  const pieces = [];
  for (let i = 0; i < across; i++) pieces.push(L);
  for (let i = 0; i < down; i++) pieces.push(W);

  const totalLF = pieces.reduce((a, b) => a + b, 0);

  let naive = 0, scrap = 0;
  pieces.forEach(len => {
    if (len <= 0) return;
    const barsForPiece = Math.ceil(len / USABLE);
    naive += barsForPiece;
    scrap += barsForPiece * USABLE - len;
  });

  const usableScrap = scrap >= reuse ? scrap : 0;
  const saved = Math.floor(usableScrap / USABLE);
  const bars = Math.max(0, naive - saved);

  $("rRuns").textContent = across + " \u00d7 " + down;
  $("rLF").textContent = f0(totalLF) + " ft";
  $("rBars").textContent = f0(naive);
  $("rReuseOut").textContent = f0(bars) + "  (saves " + f0(saved) + ")";
  $("rC600").textContent = f0(Math.ceil(totalLF / 600));
  $("rC400").textContent = f0(Math.ceil(totalLF / 400));
}

function calcPipe() {
  const L = num("pL"), W = num("pW");
  const sp = num("pOC") || 12;
  const coil = num("pCoil") || 600;

  const across = Math.ceil((W * 12) / sp) + 1;
  const down = Math.ceil((L * 12) / sp) + 1;
  const totalLF = across * L + down * W;

  $("pSize").textContent = sp === 16 ? '5/8" @ 16" o/c' : '1/2" @ 12" o/c';
  $("pRuns").textContent = across + " \u00d7 " + down;
  $("pLF").textContent = f0(totalLF) + " ft";
  $("pCoils").textContent = f0(Math.ceil(totalLF / coil)) + " \u00d7 " + coil + " ft";
}

function calcGravel() {
  const L = num("gL"), W = num("gW"), D = num("gD");
  const cy = (L * W * (D / 12)) / 27;
  $("gCY").textContent = f2(cy);
  $("gTon").textContent = f1(cy * 1.4);
  $("gCYw").textContent = f2(cy * 1.1);
}

function calcConc() {
  const L = num("kL"), W = num("kW"), T = num("kT"), w = num("kWaste");
  const cf = L * W * (T / 12);
  const cy = cf / 27;
  $("kCF").textContent = f1(cf);
  $("kCY").textContent = f2(cy);
  $("kCYw").textContent = f2(cy * (1 + w / 100));
  $("kB80").textContent = f0(Math.ceil(cf / 0.6));
}

function recalc() {
  calcCross(); calcRebar(); calcPipe(); calcGravel(); calcConc();
}

document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".pane").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    $(b.dataset.pane).classList.add("on");
  });
});

document.querySelectorAll("input,select").forEach(el => {
  el.addEventListener("input", recalc);
  el.addEventListener("change", recalc);
});

recalc();
/* ---------- settings ---------- */
const KEY_CO = "jc_co";
const KEY_LOGO = "jc_logo";

function readCo() {
  try { return JSON.parse(localStorage.getItem(KEY_CO)) || {}; } catch (e) { return {}; }
}

function applyCo() {
  const c = readCo();
  $("coName").textContent = c.name || "Elite Crete";
  $("coTag").textContent = c.tag || "From form to finish";
}

function applyLogo() {
  const src = localStorage.getItem(KEY_LOGO);
  const box = $("logoBox");
  box.innerHTML = src ? '<img alt="logo" src="' + src + '">' : "EC";
}

function openSheet() {
  const c = readCo();
  $("sName").value = c.name || "Elite Crete";
  $("sTag").value = c.tag || "From form to finish";
  $("sPhone").value = c.phone || "306-461-6381";
  $("sEmail").value = c.email || "Elitecrete33@gmail.com";
  $("sheetWrap").classList.add("on");
}

function closeSheet() {
  $("sheetWrap").classList.remove("on");
}

function saveSheet() {
  const c = {
    name: $("sName").value.trim() || "Elite Crete",
    tag: $("sTag").value.trim(),
    phone: $("sPhone").value.trim(),
    email: $("sEmail").value.trim()
  };
  try { localStorage.setItem(KEY_CO, JSON.stringify(c)); } catch (e) {}
  applyCo();
  closeSheet();
  toast("Saved");
}

$("gearBtn").addEventListener("click", openSheet);
$("sClose").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
$("sSave").addEventListener("click", saveSheet);

$("sLogo").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      localStorage.setItem(KEY_LOGO, r.result);
      applyLogo();
      toast("Logo saved");
    } catch (err) {
      toast("Logo too large");
    }
  };
  r.readAsDataURL(file);
});

/* ---------- share ---------- */
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("on"), 1600);
}

function buildText() {
  const pane = document.querySelector(".pane.on");
  const title = pane.querySelector(".card h2").textContent;
  const c = readCo();
  const lines = [];

  lines.push((c.name || "Elite Crete") + (c.tag ? " — " + c.tag : ""));
  lines.push(title + " takeoff");
  lines.push("");

  const inputs = [];
  pane.querySelectorAll(".grid > div").forEach(d => {
    const lab = d.querySelector("label");
    const inp = d.querySelector("input,select");
    if (!lab || !inp) return;
    const v = inp.tagName === "SELECT"
      ? inp.options[inp.selectedIndex].textContent
      : inp.value;
    if (v) inputs.push(lab.textContent + ": " + v);
  });
  if (inputs.length) { lines.push.apply(lines, inputs); lines.push(""); }

  pane.querySelectorAll(".row").forEach(r => {
    lines.push(r.querySelector("span").textContent + ": " + r.querySelector("b").textContent);
  });

  const foot = [c.phone, c.email].filter(Boolean).join(" · ");
  if (foot) { lines.push(""); lines.push(foot); }

  return lines.join("\n");
}

async function shareNow() {
  const text = buildText();
  if (navigator.share) {
    try {
      await navigator.share({ title: "Takeoff", text: text });
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("Copied");
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied"); }
    catch (e2) { toast("Copy failed"); }
    document.body.removeChild(ta);
  }
}

$("shareBtn").addEventListener("click", shareNow);

applyCo();
applyLogo();
</script>
</body>
</html>
